name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies & Build Web Assets
        working-directory: do-it-frontend
        run: |
          npm ci || npm install
          npm run build

      - name: Copy Assets to Android App
        run: |
          mkdir -p do-it-android/app/src/main/assets/public
          cp -r do-it-frontend/dist/* do-it-android/app/src/main/assets/public/

      - name: Make Gradle Wrapper Executable
        working-directory: do-it-android
        run: chmod +x ./gradlew

      - name: Build Debug APK with Gradle
        working-directory: do-it-android
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DO-IT-apk
          path: do-it-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
