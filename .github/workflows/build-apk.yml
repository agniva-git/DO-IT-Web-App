name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'do-it-frontend/**'
      - 'do-it-android/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    name: Compile DO-IT Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'do-it-frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: ./do-it-frontend
        run: npm ci

      - name: Build Web Application
        working-directory: ./do-it-frontend
        env:
          VITE_API_URL: https://do-it-api-6ti5.onrender.com
        run: npm run build

      - name: Copy Web Dist into Android Assets
        run: |
          mkdir -p do-it-android/app/src/main/assets/public
          rm -rf do-it-android/app/src/main/assets/public/*
          cp -r do-it-frontend/dist/* do-it-android/app/src/main/assets/public/
          cp do-it-frontend/capacitor.config.json do-it-android/app/src/main/assets/capacitor.config.json

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Make gradlew executable
        working-directory: ./do-it-android
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: ./do-it-android
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare APK for Release
        run: |
          mkdir -p release-output
          cp do-it-android/app/build/outputs/apk/debug/app-debug.apk release-output/DO-IT.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DO-IT-Android-APK
          path: release-output/DO-IT.apk

      - name: Publish or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest-apk
          name: DO-IT Android App (Latest APK)
          body: |
            ### DO-IT Android Application 📱

            Download the attached `DO-IT.apk` directly to your Android device and tap to install!

            - **Backend Connected**: `https://do-it-api-6ti5.onrender.com`
            - **Features**: Tasks, Study, Focus Timers, Fitness, Habits, Expenses, and Web Push Notifications.
          files: release-output/DO-IT.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
