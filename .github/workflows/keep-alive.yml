name: Keep Render Backend Alive

on:
  schedule:
    # Run every 10 minutes (cron runs UTC)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping-backend:
    name: Heartbeat Ping
    runs-on: ubuntu-latest
    steps:
      - name: Ping DO-IT Backend on Render
        run: |
          echo "Pinging DO-IT Render backend to keep instance warm..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 45 https://do-it-api-6ti5.onrender.com/ || echo "000")
          echo "Render response code: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "Backend is awake and responding healthy."
          else
            echo "Wake-up signal sent (status $HTTP_STATUS). Render spin-up initiated if cold."
          fi
